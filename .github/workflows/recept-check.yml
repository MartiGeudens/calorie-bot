name: Recept toevoegen

on:
  workflow_dispatch:  # Getriggerd door cron-job.org (elke 30 minuten)

permissions:
  contents: write

jobs:
  recept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer afhankelijkheden
        run: pip install requests groq

      - name: Verwerk recepten
        run: python scripts/recept_verwerken.py
        env:
          BOT_TOKEN:    ${{ secrets.BOT_TOKEN }}
          CHAT_ID:      ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
