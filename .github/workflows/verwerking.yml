name: Maaltijden verwerken (00:00)

on:
  workflow_dispatch:         # Getriggerd door cron-job.org om 00:00

permissions:
  contents: write             # Nodig om recepten.json te committen

jobs:
  verwerking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer afhankelijkheden
        run: pip install requests groq pytz

      - name: Verwerk maaltijden
        run: python scripts/process_food.py
        env:
          BOT_TOKEN:       ${{ secrets.BOT_TOKEN }}
          CHAT_ID:         ${{ secrets.CHAT_ID }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
