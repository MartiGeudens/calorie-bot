name: Dagelijkse herinnering (21:00)

on:
  workflow_dispatch:         # Getriggerd door cron-job.org om 21:00

jobs:
  herinnering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer afhankelijkheden
        run: pip install requests groq pytz

      - name: Stuur herinnering
        run: python scripts/remind.py
        env:
          BOT_TOKEN:    ${{ secrets.BOT_TOKEN }}
          CHAT_ID:      ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
