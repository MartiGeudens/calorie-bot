name: Ochtend gewichtsvraag (09:00)

on:
  workflow_dispatch:         # Getriggerd door cron-job.org om 09:00

jobs:
  gewicht-vraag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer afhankelijkheden
        run: pip install requests

      - name: Stuur gewichtsvraag
        run: python gewicht_vraag.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
