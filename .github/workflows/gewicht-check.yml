name: Gewicht check (15:00)

on:
  workflow_dispatch:         # Getriggerd door cron-job.org om 15:00

jobs:
  gewicht-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer afhankelijkheden
        run: pip install requests pytz

      - name: Check gewicht
        run: python scripts/gewicht_check.py
        env:
          BOT_TOKEN:       ${{ secrets.BOT_TOKEN }}
          CHAT_ID:         ${{ secrets.CHAT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
