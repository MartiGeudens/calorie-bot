name: Recept toevoegen

on:
  schedule:
    - cron: '0 7,9,11,13,15,17,19,21 * * *'  # Elke 2u van 09:00-23:00 CEST
  workflow_dispatch:                            # Ook nog handmatig te starten

permissions:
  contents: write

jobs:
  recept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer afhankelijkheden
        run: pip install requests groq

      - name: Verwerk recepten
        run: python recept_verwerken.py
        env:
          BOT_TOKEN:    ${{ secrets.BOT_TOKEN }}
          CHAT_ID:      ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
