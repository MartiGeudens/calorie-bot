<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Receptenboek</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f5f5;
      --card:     #ffffff;
      --text:     #111111;
      --subtext:  #888888;
      --accent:   #111111;
      --border:   #e5e5e5;
      --shadow:   0 1px 4px rgba(0,0,0,0.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: #111;
      color: #fff;
      padding: 18px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 12px;
    }

    .search-bar {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.9rem;
      width: 100%;
    }

    .search-bar input::placeholder { color: rgba(255,255,255,0.4); }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .recipe-count {
      font-size: 0.82rem;
      color: var(--subtext);
    }
    .recipe-count strong { color: var(--text); }

    .sort-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      outline: none;
      font-family: inherit;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1px;
      background: var(--border);
    }

    @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

    /* Card */
    .card {
      background: var(--card);
      padding: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      text-transform: capitalize;
      margin-bottom: 2px;
    }

    .card-portie {
      font-size: 0.78rem;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .kcal-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 10px;
    }

    .kcal-num {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
    }

    .kcal-label {
      font-size: 0.75rem;
      color: var(--subtext);
    }

    .macros {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .macro {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
    }

    .macro-label {
      font-size: 0.68rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 1px;
    }

    .macro-val {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .bron-badge {
      display: inline-block;
      font-size: 0.68rem;
      color: var(--subtext);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      margin-bottom: 10px;
    }

    /* Ingredienten toggle */
    .ingr-toggle {
      width: 100%;
      background: none;
      border: none;
      border-top: 1px solid var(--border);
      padding: 10px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--subtext);
      font-family: inherit;
    }

    .ingr-toggle:hover { color: var(--text); }

    .ingr-toggle .arrow {
      transition: transform 0.2s;
      font-size: 0.65rem;
    }

    .ingr-toggle.open .arrow { transform: rotate(180deg); }

    .ingr-list {
      display: none;
      padding-top: 8px;
    }

    .ingr-list.open { display: block; }

    .ingr-item {
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--subtext);
    }

    .ingr-item:last-child { border-bottom: none; }

    /* States */
    .center-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--subtext);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .no-results { display: none; }

    footer {
      text-align: center;
      padding: 20px 16px;
      font-size: 0.75rem;
      color: var(--subtext);
    }
  </style>
</head>
<body>

<header>
  <h1>Receptenboek</h1>
  <div class="search-bar">
    <input type="text" id="search" placeholder="Zoek recept…" autocomplete="off" />
  </div>
</header>

<div class="toolbar">
  <span class="recipe-count" id="recipeCount">Laden…</span>
  <select class="sort-select" id="sortSelect" onchange="sortCards()">
    <option value="naam">A–Z</option>
    <option value="eiwitten">Meeste eiwitten</option>
    <option value="calories">Meeste kcal</option>
    <option value="calories_asc">Minste kcal</option>
  </select>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="center-msg no-results" id="noResults">Geen recepten gevonden.</div>
  <div class="center-msg" id="loadingMsg">Recepten laden…</div>
</main>

<footer id="footer"></footer>

<script>
  function fmtNaam(naam) {
    return naam.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function renderCard(naam, data) {
    const ingr = data.ingredienten || [];
    const bron = data.macros_bron === 'manueel' ? 'Manueel' : 'AI';

    const ingrHtml = ingr.length
      ? ingr.map(i => `<div class="ingr-item">${i}</div>`).join('')
      : '<div class="ingr-item">Geen ingrediënten opgeslagen</div>';

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.naam = naam.toLowerCase();
    card.innerHTML = `
      <div class="card-title">${fmtNaam(naam)}</div>
      <div class="card-portie">${data.portie || '1 portie'}</div>
      <div class="kcal-row">
        <span class="kcal-num">${data.calories}</span>
        <span class="kcal-label">kcal</span>
      </div>
      <div class="macros">
        <div class="macro">
          <div class="macro-label">Eiwitten</div>
          <div class="macro-val">${data.eiwitten}g</div>
        </div>
        <div class="macro">
          <div class="macro-label">Koolhydraten</div>
          <div class="macro-val">${data.koolhydraten}g</div>
        </div>
        <div class="macro">
          <div class="macro-label">Vetten</div>
          <div class="macro-val">${data.vetten}g</div>
        </div>
        <div class="macro">
          <div class="macro-label">Vezels</div>
          <div class="macro-val">${data.vezels}g</div>
        </div>
      </div>
      <span class="bron-badge">${bron}</span>
      <button class="ingr-toggle" onclick="toggleIngr(this)">
        <span>Ingrediënten (${ingr.length})</span>
        <span class="arrow">▼</span>
      </button>
      <div class="ingr-list">${ingrHtml}</div>`;

    return card;
  }

  function toggleIngr(btn) {
    btn.classList.toggle('open');
    btn.nextElementSibling.classList.toggle('open');
  }

  let allRecepten = {};

  function sortCards() {
    const sortBy = document.getElementById('sortSelect').value;
    const grid = document.getElementById('grid');
    const cards = [...grid.querySelectorAll('.card')];

    cards.sort((a, b) => {
      const na = a.dataset.naam, nb = b.dataset.naam;
      const da = allRecepten[na] || {}, db = allRecepten[nb] || {};
      if (sortBy === 'naam')         return na.localeCompare(nb);
      if (sortBy === 'eiwitten')     return (db.eiwitten || 0) - (da.eiwitten || 0);
      if (sortBy === 'calories')     return (db.calories || 0) - (da.calories || 0);
      if (sortBy === 'calories_asc') return (da.calories || 0) - (db.calories || 0);
      return 0;
    });

    cards.forEach(c => grid.appendChild(c));
  }

  async function load() {
    try {
      const resp = await fetch('recepten.json?v=' + Date.now());
      allRecepten = await resp.json();
      const namen = Object.keys(allRecepten);

      document.getElementById('loadingMsg').style.display = 'none';

      if (namen.length === 0) {
        document.getElementById('loadingMsg').style.display = 'block';
        document.getElementById('loadingMsg').textContent = 'Nog geen recepten opgeslagen.';
        document.getElementById('recipeCount').innerHTML = '<strong>0</strong> recepten';
        return;
      }

      document.getElementById('recipeCount').innerHTML = `<strong>${namen.length}</strong> recepten`;

      const grid = document.getElementById('grid');
      namen.sort().forEach(naam => grid.appendChild(renderCard(naam, allRecepten[naam])));

      document.getElementById('footer').textContent =
        new Date().toLocaleDateString('nl-BE', {day:'numeric', month:'long', year:'numeric'});

      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        let found = 0;
        document.querySelectorAll('.card').forEach(card => {
          const match = card.dataset.naam.includes(q) || card.dataset.naam.replace(/_/g,' ').includes(q);
          card.style.display = match ? '' : 'none';
          if (match) found++;
        });
        document.getElementById('noResults').style.display = found === 0 ? 'block' : 'none';
      });

    } catch(err) {
      document.getElementById('loadingMsg').textContent = 'Kon recepten niet laden.';
    }
  }

  load();
</script>
</body>
</html>
